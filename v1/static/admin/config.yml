#
#. This config file adds support for Netlify CMS, exposed at /admin on the running site.
# In order to use this on your site,
#. 1) replace instances of "exampleSite/......" with the appropriate paths, relative from repository root.
#. 2) replace repo path in `backend` settings, and set branch to master.
#  3) Optionally enable the [editor workflow](https://www.netlifycms.org/docs/configuration-options/#publish-mode) which uses PRs for content changes
#  4) Optionally enable [open authoring](https://www.netlifycms.org/docs/open-authoring/) for community sites, which requires #3
#
#

backend:
  name: git-gateway
  repo: cuert-web/cuert-website
  branch: main
  publish_mode: editorial_workflow
  site_domain: https://cu-eco.org
  display_url: https://cu-eco.org
  logo_url: https://cu-eco.org/favicon.ico

media_folder: "v1/static/img" # Folder where user uploaded files should go
public_folder: "/img" # The src attribute for uploaded files will begin with this folder name

collections: # A list of collections the CMS should be able to edit
  - name: "slider"
    label: "Slider"
    widget: "list"
    folder: "v1/data/carousel"
    extension: yaml
    format: yaml
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{name}}"
    fields:
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Weight", name: "weight", widget: "number" }
      - { label: "Image", name: "image", widget: "image" }
  - name: "Announcements"
    label: "Announcements"
    folder: "v1/data/announcements"
    extension: yaml
    format: yaml
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{title}}"
    fields:
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Link", name: "link", widget: "string" }
      - { label: "Link Button Text", name: "linkText", widget: "string" }
      - { label: "Weight", name: "weight", widget: "number" }

  - name: "News" # Used in routes, ie.: /admin/collections/:slug/edit
    label: "News" # Used in the UI, ie.: "New Post"
    folder: "v1/content/blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{day}}-{{hour}}-{{minute}}-{{title}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields each document in this collection have
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "Cars"
    label: "Cars"
    folder: "v1/content/cars"
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{name}}"
    fields:
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - {
          label: "Class",
          name: "class",
          widget: "select",
          options: ["Prototype", "Urban Concept"],
          default: "Prototype",
        }
      - { label: "Year", name: "year", widget: "number", default: 2021 }
      - { label: "Max Speed", name: "maxSpeed", widget: "number" }
      - { label: "Distance", name: "distancePerLiter", widget: "number" }
      - {
          label: "Unit",
          name: "unit",
          widget: "select",
          options: ["Distance / KWh", "Distance / Liter"],
          default: "Distance / KWh",
        }
      - {
          label: "Achievements",
          name: "achievements",
          widget: "list",
          required: false,
          fields:
            [
              {
                label: "Icon",
                name: "icon",
                widget: "select",
                options:
                  [
                    "🏆 Trophy",
                    "🌟 Award",
                    "🥇 First",
                    "🥈 Second",
                    "🥉 Third",
                  ],
                default: "🏆 Trophy",
              },
              { label: "Year", name: "year", widget: "number" },
              { label: "Achievement", name: "achievement", widget: "string" },
              { label: "Image", name: "image", widget: "image" },
              { label: "Link", name: "link", widget: "string" },
            ],
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "Achievements"
    label: "Achievements"
    folder: "v1/data/testimonials"
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{title}}"
    extension: yaml
    format: yaml
    fields:
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Award Date",
          name: "date",
          widget: "date",
          format: "YYYY-MM-DD",
        }
      - { label: "Image", name: "image", widget: "image" }

      - { label: "Body", name: "awardingBody", widget: "string" }
      - { label: "Weight", name: "weight", widget: "number", default: 100 }
  - name: "Team Members"
    label: "Team Members"
    folder: "v1/content/team-members"
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{name}}"
    fields:
      - { label: "Team Name", name: "team", widget: "string", required: true }
      - {
          label: "isDirectorsBoard",
          name: "isDirectorsBoard",
          widget: "boolean",
          default: false,
        }
      - {
          name: "head",
          label: "Head",
          widget: "object",
          required: true,
          fields:
            [
              {
                name: "name",
                label: "Head Name",
                widget: "string",
                required: true,
              },
              {
                name: "image",
                label: "Image",
                widget: "image",
                required: true,
              },
              {
                name: "email",
                label: "Email",
                widget: "string",
                required: false,
              },
              {
                name: "linkedin",
                label: "LinkedIn",
                widget: "string",
                required: false,
              },
              {
                name: "github",
                label: "GitHub",
                widget: "string",
                required: false,
              },
              {
                name: "facebook",
                label: "Facebook",
                widget: "string",
                required: false,
              },
            ],
        }
      - {
          name: "members",
          label: "Members",
          widget: "list",
          fields:
            [
              { name: "name", label: "Name", widget: "string", required: true },
              {
                name: "image",
                label: "Image",
                widget: "image",
                required: true,
              },
              {
                name: "role",
                label: "Role",
                widget: "select",
                required: true,
                options:
                  [
                    "Member",
                    "Senior Member",
                    "Head",
                    "Vice Head",
                    "Director",
                    "Advisor",
                    "Racing Team Manager",
                  ],
              },
              {
                name: "email",
                label: "Email",
                widget: "string",
                required: false,
              },
              {
                name: "linkedin",
                label: "LinkedIn",
                widget: "string",
                required: false,
              },
              {
                name: "github",
                label: "GitHub",
                widget: "string",
                required: false,
              },
              {
                name: "facebook",
                label: "Facebook",
                widget: "string",
                required: false,
              },
            ],
        }
      - { label: "Team Description", name: "body", widget: "markdown" }

  - name: "Sponsors"
    label: "Sponsors"
    folder: "v1/data/clients"
    extension: yaml
    format: yaml
    create: true
    slug: "{{day}}-{{hour}}-{{minute}}-{{name}}"
    fields:
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default = false,
        }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Logo", name: "image", widget: "image" }
      - { label: "Link", name: "url", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Main Sponsor", value: "main" }
          - { label: "Automotive & Industrial Sponsors", value: "automotive" }
          - { label: "Apparel Sponsor", value: "apparel" }
          - { label: "Technology Sponsors", value: "technology" }
          - { label: "Software Sponsors", value: "software" }
          - { label: "Academic Sponsor", value: "academic" }
          - { label: "Strategic & Event Sponsors", value: "strategic" }
      - { label: "Order within category (1 = first)", name: "weight", widget: "number", value_type: "int", default: 10 }
      - { label: "Logo size boost (optional, e.g. 1.2 = 20% bigger, max 1.3)", name: "scale", widget: "number", value_type: "float", min: 1, max: 1.3, step: 0.05, required: false }

  - name: "settings"
    label: "Settings"
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - label: "Site Settings"
        name: "general"
        file: "config.yaml"
        extension: yaml
        description: "General Site Settings"
        fields:
          - label: "Global title"
            name: "title"
            widget: "string"

          - label: "Site Url"
            name: "baseURL"
            widget: "string"

          - label: "Theme"
            name: "theme"
            widget: "hidden"
            default: "up-business-theme"

          - label: "Language Code"
            name: "languageCode"
            widget: "hidden"
            default: "en-us"

          - label: "title"
            name: "params.title"
            widget: "string"

          - label: "description"
            name: "params.description"
            widget: "string"

          - label: "images"
            name: "params.images"
            widget: "list"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"

          - label: "logo"
            name: "params.logo"
            widget: "string"

          - label: "themeColor"
            name: "params.favicons.themeColor"
            widget: "string"

          - label: "backgroundColor"
            name: "params.favicons.backgroundColor"
            widget: "string"

          - label: "faviconColor"
            name: "params.favicons.faviconColor"
            widget: "string"

          - label: "linkedin"
            name: "params.social.handles.linkedIn"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Link"
                name: "link"
                widget: "string"

          - label: "instagram"
            name: "params.social.handles.instagram"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Link"
                name: "link"
                widget: "string"

          - label: "facebook"
            name: "params.social.handles.facebook"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Link"
                name: "link"
                widget: "string"

          - label: "twitter"
            name: "params.social.handles.twitter"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Link"
                name: "link"
                widget: "string"

          - label: "location"
            name: "location"
            widget: "list"
            fields:
              - label: "Location"
                name: "location"
                widget: "string"

          - label: "contact"
            name: "contact"
            widget: "list"
            fields:
              - label: "Contact"
                name: "contact"
                widget: "string"

          - label: "copyright"
            name: "params.copyright"
            widget: "string"

          - label: "Home"
            name: "menus.main.home"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"

          - label: "How we work"
            name: "menus.main.how-we-work"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"

          - label: "Our team"
            name: "menus.main.our-team"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"

          - label: "Achievements"
            name: "menus.main.achievements"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"

          - label: "News"
            name: "menus.main.news"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"

          - label: "Contact Us"
            name: "menus.buttons.contact-us"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Weight"
                name: "weight"
                widget: "number"
              - label: "Pre"
                name: "pre"
                widget: "string"
